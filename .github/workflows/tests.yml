name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[all,benchmark,dev]"
      - run: python -m ruff check racing_lab tests examples
      - run: python -m ruff format --check racing_lab tests examples
      - run: python -m pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python -m build
